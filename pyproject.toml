[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-llm-inference-engine"
version = "0.1.0"
description = "A lightweight, batched, streaming LLM inference engine with an OpenAI-compatible API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch==2.4.1",
  "transformers==4.44.2",
  "tokenizers==0.19.1",
  "numpy==1.26.4",
  "fastapi==0.114.2",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "huggingface-hub==0.24.7",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "httpx==0.27.2"]

[project.scripts]
flux = "flux.__main__:main"

[tool.setuptools.packages.find]
include = ["flux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
