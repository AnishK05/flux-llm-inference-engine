<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flux · LLM Inference Engine</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #141a2e;
    --panel-2: #1b2338;
    --accent: #6ea8fe;
    --accent-2: #8b5cf6;
    --text: #e8ecf5;
    --muted: #9aa3b8;
    --user: #223052;
    --assistant: #182036;
    --border: #263050;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 800px at 80% -10%, #1a2547 0%, var(--bg) 55%);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(20, 26, 46, 0.6);
    backdrop-filter: blur(8px);
  }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-weight: 800; color: #0b1020;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 12px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
  .dot.ok { background: #34d399; box-shadow: 0 0 10px #34d399; }
  main { flex: 1; display: flex; overflow: hidden; }
  .chat { flex: 1; display: flex; flex-direction: column; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 12px; max-width: 820px; }
  .msg .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex: 0 0 30px;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
  }
  .msg.user .avatar { background: var(--user); color: var(--accent); }
  .msg.assistant .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #0b1020; }
  .bubble {
    background: var(--assistant); border: 1px solid var(--border);
    padding: 12px 16px; border-radius: 12px; line-height: 1.55; white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user .bubble { background: var(--user); }
  .empty { color: var(--muted); text-align: center; margin: auto; max-width: 420px; }
  .empty h2 { color: var(--text); font-weight: 600; }
  footer { border-top: 1px solid var(--border); padding: 16px 24px; background: rgba(20,26,46,.6); }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    font-size: 15px; font-family: inherit; min-height: 24px; max-height: 160px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button.send {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #0b1020;
    border: none; border-radius: 12px; padding: 12px 20px; font-weight: 700; cursor: pointer;
    font-size: 15px;
  }
  button.send:disabled { opacity: .5; cursor: not-allowed; }
  .controls { max-width: 820px; margin: 10px auto 0; display: flex; gap: 18px; color: var(--muted); font-size: 12px; align-items: center; flex-wrap: wrap; }
  .controls label { display: flex; gap: 6px; align-items: center; }
  .controls input[type=range] { accent-color: var(--accent); }
  .cursor { display: inline-block; width: 8px; height: 16px; background: var(--accent); margin-left: 2px; animation: blink 1s steps(2) infinite; vertical-align: text-bottom; }
  @keyframes blink { 0%,50%{opacity:1;} 51%,100%{opacity:0;} }
</style>
</head>
<body>
  <header>
    <div class="logo">F</div>
    <div>
      <h1>Flux</h1>
      <div class="sub">LLM Inference Engine</div>
    </div>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">connecting…</span>
    </div>
  </header>
  <main>
    <div class="chat">
      <div id="messages">
        <div class="empty" id="empty">
          <h2>Start a conversation</h2>
          <p>Flux streams tokens from a local model through an OpenAI-compatible API.</p>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <div class="composer">
      <textarea id="input" placeholder="Send a message…" rows="1"></textarea>
      <button class="send" id="send">Send</button>
    </div>
    <div class="controls">
      <label>temp <input type="range" id="temp" min="0" max="1.5" step="0.05" value="0.8" /><span id="tempV">0.80</span></label>
      <label>max tokens <input type="range" id="maxtok" min="16" max="256" step="16" value="96" /><span id="maxtokV">96</span></label>
    </div>
  </footer>

<script>
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendEl = document.getElementById("send");
const emptyEl = document.getElementById("empty");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const tempEl = document.getElementById("temp");
const tempV = document.getElementById("tempV");
const maxtokEl = document.getElementById("maxtok");
const maxtokV = document.getElementById("maxtokV");

const history = [];

tempEl.oninput = () => (tempV.textContent = Number(tempEl.value).toFixed(2));
maxtokEl.oninput = () => (maxtokV.textContent = maxtokEl.value);

inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
});
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
sendEl.addEventListener("click", send);

async function refreshStatus() {
  try {
    const r = await fetch("/health");
    const j = await r.json();
    if (j.status === "ok") {
      statusDot.classList.add("ok");
      statusText.textContent = j.model + " · ready";
    } else {
      statusText.textContent = "loading model…";
    }
  } catch { statusText.textContent = "offline"; }
}
refreshStatus();
setInterval(refreshStatus, 4000);

function addMessage(role, text) {
  if (emptyEl) emptyEl.remove();
  const msg = document.createElement("div");
  msg.className = "msg " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "You" : "F";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  inputEl.style.height = "auto";
  sendEl.disabled = true;

  addMessage("user", text);
  history.push({ role: "user", content: text });

  const bubble = addMessage("assistant", "");
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  bubble.appendChild(cursor);

  let acc = "";
  try {
    const resp = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: history,
        stream: true,
        temperature: Number(tempEl.value),
        max_tokens: Number(maxtokEl.value),
      }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const payload = line.slice(6).trim();
        if (payload === "[DONE]") continue;
        try {
          const obj = JSON.parse(payload);
          const delta = obj.choices?.[0]?.delta?.content;
          if (delta) {
            acc += delta;
            bubble.textContent = acc;
            bubble.appendChild(cursor);
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        } catch {}
      }
    }
  } catch (e) {
    acc = acc || "[error contacting engine]";
  }
  cursor.remove();
  bubble.textContent = acc.trim() || "…";
  history.push({ role: "assistant", content: acc.trim() });
  sendEl.disabled = false;
  inputEl.focus();
}
</script>
</body>
</html>
